site_name: From Graph to NPU
site_description: A chapter-based guide to building a RISC-V-hosted NPU software and simulation stack
site_author: buicongnguyen
site_url: https://buicongnguyen.github.io/NPU_sw_stack/
repo_name: buicongnguyen/NPU_sw_stack
repo_url: https://github.com/buicongnguyen/NPU_sw_stack
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/images/npu-stack-logo.svg
  favicon: assets/images/npu-stack-logo.svg
  features:
    - content.action.edit
    - content.code.copy
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/buicongnguyen/NPU_sw_stack
      name: NPU Software Stack on GitHub
  status:
    planned: Planned
    unverified: Unverified

copyright: Documentation release candidate &mdash; implementation verification deferred

